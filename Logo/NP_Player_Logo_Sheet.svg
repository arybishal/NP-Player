<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NP Player logo sheet</title>
  <defs>
    <g id="mark-b">
      <rect x="122" y="130" width="62" height="252" rx="18"/>
      <path d="M232 150 Q232 124 256 138 L392 236 Q412 256 392 276 L256 374 Q232 388 232 362 Z"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- 1 Primary icon -->
  <g transform="translate(60,60) scale(0.9)">
    <rect width="512" height="512" rx="116" fill="#FFD60A"/>
    <use href="#mark-b" fill="#000000"/>
  </g>
  <text x="60" y="560" font-size="22" font-weight="700" fill="#000000">Primary icon</text>

  <!-- 2 Dark icon -->
  <g transform="translate(560,60) scale(0.9)">
    <rect width="512" height="512" rx="116" fill="#000000"/>
    <use href="#mark-b" fill="#FFD60A"/>
  </g>
  <text x="560" y="560" font-size="22" font-weight="700" fill="#000000">Dark / night version</text>

  <!-- 3 Horizontal lockup on white -->
  <g transform="translate(60,610)">
    <g transform="scale(0.26)">
      <rect width="512" height="512" rx="116" fill="#FFD60A"/>
      <use href="#mark-b" fill="#000000"/>
    </g>
    <text x="160" y="88" font-size="76" font-weight="800" fill="#000000" letter-spacing="-2">NP <tspan fill="#000000" font-weight="400">Player</tspan></text>
    <rect x="164" y="104" width="120" height="8" rx="4" fill="#FFD60A"/>
  </g>

  <!-- 4 Lockup on black -->
  <rect x="640" y="600" width="500" height="150" rx="28" fill="#000000"/>
  <g transform="translate(676,636)">
    <g transform="scale(0.152)">
      <rect width="512" height="512" rx="116" fill="#FFD60A"/>
      <use href="#mark-b" fill="#000000"/>
    </g>
    <text x="100" y="62" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">NP <tspan fill="#FFD60A" font-weight="400">Player</tspan></text>
  </g>
</svg>
